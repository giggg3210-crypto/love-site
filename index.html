<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I love you ❤️</title>

<style>
body {
    margin: 0;
    background: black;
    overflow: hidden;
    font-family: monospace;
    color: #ff4d6d;
}

/* Текстовое сердце */
#heart {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 10px;
    line-height: 10px;
    white-space: pre;
    animation: glow 2s infinite alternate;
}

@keyframes glow {
    from {
        color: #ff4d6d;
        text-shadow: 0 0 10px #ff4d6d;
    }
    to {
        color: #ff1a4d;
        text-shadow: 0 0 25px #ff1a4d, 0 0 50px #ff4d6d;
    }
}
</style>
</head>

<body>

<div id="heart"></div>

<script>
const heart = document.getElementById("heart");

function drawHeart() {
    let text = "";
    for (let y = 1.5; y > -1.5; y -= 0.1) {
        for (let x = -1.5; x < 1.5; x += 0.05) {
            let formula = Math.pow(x*x + y*y - 1, 3) - x*x*y*y*y;
            if (formula <= 0) {
                text += "I love you ";
            } else {
                text += " ";
            }
        }
        text += "\n";
    }
    heart.textContent = text;
}

drawHeart();
</script>

</body>
</html>
